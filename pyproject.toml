[project]
name = "genrewrite"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx[socks]==0.27.2",
    "numpy==1.26.4",
    "openai==1.35.13",
    "pandas==2.2.2",
    "psycopg2==2.9.9",
    "scikit-learn==1.5.1",
    "scipy==1.13.1",
    "tabulate==0.9.0",
    "tiktoken==0.7.0",
    "tokenizers==0.19.1",
    "torch==2.14.0",
    "tqdm==4.66.4",
    "transformers==4.41.2",
]

[project.scripts]
genrewrite = "genrewrite:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
